<style>
  .app-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #000;
    transition: opacity .35s ease, visibility .35s;
  }
  .is-hidden > .app-splash { opacity: 0; visibility: hidden; }
  .app-splash__inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .app-splash__logo {
    display: block;
    width: min(340px, 72vw);
    height: auto;
    animation: app-splash-in .6s ease-out both;
  }
  .app-splash__bar {
    position: relative;
    width: 72px;
    height: 6px;
    overflow: hidden;
    background: #1A1B1E;
  }
  .app-splash__bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #2F5596 0 66.66%, #ED1B24 66.66% 100%);
    animation: app-splash-slide 1.2s ease-in-out infinite;
  }
  .app-splash__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  @keyframes app-splash-in {
    from { opacity: 0; transform: scale(.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes app-splash-slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .app-splash { transition: none; }
    .app-splash__logo, .app-splash__bar::before { animation: none; }
  }
</style>
<div class="app-splash" role="status">
  <div class="app-splash__inner">
    <img
      class="app-splash__logo"
      src="/logo.png"
      alt="Blaster Pro Audio Touring Group"
      width="837"
      height="263"
    >
    <div class="app-splash__bar" aria-hidden="true"></div>
    <span class="app-splash__sr">Loading…</span>
  </div>
</div>
